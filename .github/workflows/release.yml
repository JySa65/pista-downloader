name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # test build: installers uploaded as workflow artifacts only

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest # arm64
            target: macos
          - os: ubuntu-22.04 # oldest supported glibc for the AppImage
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }} # passed via env, never inlined into the script
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          uv run --no-project python packaging/build.py --check-tag "$TAG"

      - name: Install system libraries for Qt (Linux build only)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3

      # Every Python package (incl. the Linux-only Qt backend) comes from uv.lock, with hashes.
      - name: Install dependencies (locked)
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            uv sync --locked --group build --group linux-qt
          else
            uv sync --locked --group build
          fi

      - name: Tests
        run: uv run --no-sync pytest -q

      - name: Dependency audit (non-blocking)
        if: matrix.target == 'linux'
        continue-on-error: true
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --require-hashes --disable-pip \
            || echo "::warning::pip-audit reported vulnerabilities or could not run; see the log above"

      - name: Cache LGPL ffmpeg (macOS source build)
        if: matrix.target == 'macos'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ffmpeg
          key: ffmpeg-macos-${{ hashFiles('packaging/build_ffmpeg_macos.sh') }}

      - name: Install Inno Setup (Windows, pinned)
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          INNO_VERSION: "6.7.1"
        run: |
          # The Chocolatey package pins the installer's download URL and checksum for this version.
          choco install innosetup --version $env:INNO_VERSION -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $found = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "ISCC.exe version: $found"
          if (-not $found.StartsWith($env:INNO_VERSION)) { Write-Error "Expected Inno Setup $env:INNO_VERSION, got $found"; exit 1 }

      - name: Build installer
        run: uv run --no-sync python packaging/build.py

      - name: Bundled ffmpeg must not be GPL
        shell: bash
        run: |
          ff=build/ffmpeg/ffmpeg; [ -f "$ff.exe" ] && ff="$ff.exe"
          "$ff" -hide_banner -version | tee /dev/stderr | grep -q -- "--enable-gpl" && exit 1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true

      - name: Checksums
        working-directory: installers
        run: |
          sha256sum -- *.exe *.dmg *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            installers/*.exe
            installers/*.dmg
            installers/*.AppImage

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: installers/*
          generate_release_notes: true

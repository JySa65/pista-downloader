name: Update yt-dlp

# YouTube breaks old yt-dlp releases; bump the lock weekly and open a PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Upgrade yt-dlp in uv.lock
        run: uv lock --upgrade-package yt-dlp

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet uv.lock; then
            echo "yt-dlp already up to date"; exit 0
          fi
          ver=$(uv tree --package yt-dlp --depth 0 2>/dev/null | head -1 | awk '{print $2}')
          branch="deps/yt-dlp-${ver:-update}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "branch $branch already exists"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "build(deps): bump yt-dlp to ${ver:-latest}"
          git push origin "$branch"
          gh pr create --fill --base "${{ github.event.repository.default_branch }}" --head "$branch"

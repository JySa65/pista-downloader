[project]
name = "pista-downloader"
version = "0.3.1"
description = "Desktop app to download YouTube videos, playlists and Mixes as MP3/MP4 with yt-dlp, plus a local player."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "jysa65" }]
keywords = ["downloader", "mp3", "mp4", "yt-dlp", "nicegui", "music-player", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.14"
dependencies = [
    "nicegui[native]>=3.18.0",
    "yt-dlp[default,deno]>=2026.8.19",
]

[dependency-groups]
build = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
# Qt backend for the Linux AppImage (pywebview's GTK backend can't be bundled). Locked with hashes in uv.lock.
linux-qt = [
    "qtpy>=2.4.3; sys_platform == 'linux'",
    "PyQt6>=6.11.0; sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.11.0; sys_platform == 'linux'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: needs the real network or tools; skipped unless PISTA_LIVE=1",
]

[project.urls]
Homepage = "https://github.com/JySa65/pista-downloader"
Repository = "https://github.com/JySa65/pista-downloader"
Issues = "https://github.com/JySa65/pista-downloader/issues"
Releases = "https://github.com/JySa65/pista-downloader/releases"
Author = "https://jysa65.dev/es/"

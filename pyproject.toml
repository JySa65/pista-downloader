[project]
name = "youtube-download"
version = "0.2.1"
description = "Desktop app to download YouTube videos, playlists and Mixes as MP3/MP4 with yt-dlp, plus a local player."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "nicegui[native]>=3.18.0",
    "yt-dlp[default,deno]>=2026.8.19",
]

[dependency-groups]
build = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
